name: Site security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/security-policy.py --check
      - run: python3 scripts/site-integrity.py
      - run: node tests/security.cjs
      - run: node tests/glockenspiel.cjs
      - run: node tests/glockenspiel-audio.cjs
